<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colour Studio</title><link rel="stylesheet" href="src/styles.css"></head>
<body><div class="app-shell">
<aside class="sidebar">
  <div class="brand"><div class="brand-mark">◈</div><div><b>CHROMA</b><small>COLOUR STUDIO</small></div></div>
  <div class="side-label">WORKSPACE</div>
  <nav id="nav">
    <button class="nav-item active" data-page="library"><span>▦</span> Palette library</button>
    <button class="nav-item" data-page="gradient"><span>◩</span> Gradient studio</button>
    <button class="nav-item" data-page="extractor"><span>▧</span> Image extractor</button>
    <button class="nav-item" data-page="generator"><span>✳</span> AI palette generator</button>
    <button class="nav-item" data-page="preview"><span>▣</span> Live preview</button>

  <section id="content" class="content"></section>

</main></div><script src="src/app.js"></script></body></html>
